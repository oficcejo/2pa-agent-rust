services:
  okx-agent:
    build:
      context: .
      dockerfile: Dockerfile
    # Always build locally; avoids compose trying docker.io/library/okx-2pa-agent:latest first
    image: okx-2pa-agent:latest
    pull_policy: build
    container_name: okx-2pa-agent
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - TZ=Asia/Shanghai
      - RUST_LOG=info
    volumes:
      # Config and env persistence
      - ./.env:/app/.env
      - ./config:/app/config
      # Audit records and decision history persistence
      # benchmark_episodes are already embedded in the binary; volume can still load/append
      - ./records:/app/records
