services:
  okx-agent:
    build:
      context: .
      dockerfile: Dockerfile
    # Always build locally; avoids compose trying docker.io/library/okx-2pa-agent:latest first
    image: okx-2pa-agent:latest
    pull_policy: build
    container_name: okx-2pa-agent
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - TZ=Asia/Shanghai
      - RUST_LOG=info
    volumes:
      # 配置文件与环境变量持久化
      - ./.env:/app/.env
      - ./config:/app/config
      # 交易审计记录与历史决策持久化
      # benchmark_episodes 已内嵌进二进制，运行时可继续从挂载目录加载/追加
      - ./records:/app/records
